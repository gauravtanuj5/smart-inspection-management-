<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InspectFlow Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:#0f172a;
color:white;
transition:0.4s;
}

.light{background:#f1f5f9;color:#0f172a;}

header{
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:#1e293b;
}

button{
cursor:pointer;
padding:8px 15px;
border:none;
border-radius:5px;
}

.primary{background:#3b82f6;color:white;}
.danger{background:#ef4444;color:white;}

section{padding:40px 8%;}

input,select{
width:100%;
padding:8px;
margin:8px 0;
border-radius:5px;
border:none;
}

.table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

.table th,.table td{
padding:10px;
border-bottom:1px solid gray;
text-align:left;
}

.badge{
padding:4px 8px;
border-radius:4px;
font-size:12px;
}

.completed{background:#22c55e;}
.pending{background:#eab308;}
.failed{background:#ef4444;}

.stats{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.stat-box{
background:#1e293b;
padding:15px;
border-radius:10px;
}
</style>
</head>

<body>

<header>
<h2>InspectFlow Pro</h2>
<button onclick="toggleMode()">Toggle Mode</button>
</header>

<section>
<h3>Create Inspection</h3>
<form id="form">
<input type="text" id="title" placeholder="Inspection Title" required>
<input type="text" id="location" placeholder="Location" required>
<input type="text" id="inspector" placeholder="Inspector Name" required>
<input type="date" id="date" required>

<select id="status" required>
<option value="">Select Status</option>
<option value="Completed">Completed</option>
<option value="Pending">Pending</option>
<option value="Failed">Failed</option>
</select>

<button class="primary" type="submit">Add Inspection</button>
</form>
</section>

<section>
<h3>Search Inspection</h3>
<input type="text" id="search" placeholder="Search by Title..." onkeyup="renderTable()">
</section>

<section>
<h3>Statistics</h3>
<div class="stats">
<div class="stat-box">Total: <span id="total">0</span></div>
<div class="stat-box">Completed: <span id="completed">0</span></div>
<div class="stat-box">Pending: <span id="pending">0</span></div>
<div class="stat-box">Failed: <span id="failed">0</span></div>
</div>
</section>

<section>
<h3>Inspection List</h3>
<table class="table">
<thead>
<tr>
<th>Title</th>
<th>Location</th>
<th>Inspector</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</section>

<script>

let inspections = JSON.parse(localStorage.getItem("inspections")) || [];

// Toggle Mode
function toggleMode(){
document.body.classList.toggle("light");
}

// Form Submit
document.getElementById("form").addEventListener("submit",function(e){
e.preventDefault();

let data={
title:title.value,
location:location.value,
inspector:inspector.value,
date:date.value,
status:status.value
};

inspections.push(data);
localStorage.setItem("inspections",JSON.stringify(inspections));
this.reset();
renderTable();
updateStats();
});

// Render Table
function renderTable(){
let search=document.getElementById("search").value.toLowerCase();
let tbody=document.getElementById("tableBody");
tbody.innerHTML="";

inspections.filter(i=>i.title.toLowerCase().includes(search))
.forEach((item,index)=>{
let badgeClass=item.status.toLowerCase();
tbody.innerHTML+=`
<tr>
<td>${item.title}</td>
<td>${item.location}</td>
<td>${item.inspector}</td>
<td>${item.date}</td>
<td><span class="badge ${badgeClass}">${item.status}</span></td>
<td><button class="danger" onclick="deleteItem(${index})">Delete</button></td>
</tr>
`;
});
}

// Delete Function
function deleteItem(index){
inspections.splice(index,1);
localStorage.setItem("inspections",JSON.stringify(inspections));
renderTable();
updateStats();
}

// Update Stats
function updateStats(){
total.innerText=inspections.length;
completed.innerText=inspections.filter(i=>i.status=="Completed").length;
pending.innerText=inspections.filter(i=>i.status=="Pending").length;
failed.innerText=inspections.filter(i=>i.status=="Failed").length;
}

renderTable();
updateStats();

</script>

</body>
</html>
